<script>
  function switchAuthTab(type) {
    const tabs = ['national', 'otp', 'qr'];
    tabs.forEach(t => {
      const btn = document.getElementById('tab-' + t);
      const section = document.getElementById('section-' + t);
      if (t === type) {
        btn.className = 'flex-1 py-2.5 px-3 rounded text-center font-label-md text-label-md transition bg-surface-container text-primary font-semibold shadow-sm';
        section.classList.remove('hidden');
        section.classList.add('flex');
      } else {

        section.classList.add('hidden');

    });
  }
