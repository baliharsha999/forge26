name: CI - Security, Extension & RAG Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  extension-tests:
    name: Chrome Extension Audit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Extension Audit Tests (34 Tests)
        run: |
          node extension/tests/audit_extension.test.js

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install
          npm run build

  backend-rag-security-tests:
    name: Backend & RAG Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pytest pytest-asyncio fastapi pydantic pydantic-settings beautifulsoup4 requests numpy groq langchain-core langchain-text-splitters rank-bm25 faiss-cpu langgraph python-dotenv httpx

      - name: Run RAG Security & Ingestion Tests
        env:
          ADMIN_API_KEY: "test-ci-admin-key-2026"
          PYTHONPATH: "rag-pipeline"
        run: |
          pytest rag-pipeline/tests/test_audit_security.py rag-pipeline/tests/test_components.py -v

      - name: Run Backend Privacy & Civic API Tests
        env:
          PYTHONPATH: "backend"
        run: |
          pytest backend/tests/test_api.py backend/tests/test_privacy.py backend/tests/test_scheme_providers.py -v
