name: Deploy Nagarik AI to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Vite App
        env:
          VITE_SUPABASE_URL: https://ocplgpmsfwibjzjvxynv.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jcGxncG1zZndpYmp6anZ4eW52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MDQyMDQsImV4cCI6MjEwOTA4MDIwNH0.ve2ATBpUVCOBYZ5FtexNu897vLLe3oGJgOYeccLv_zY
        run: |
          cd frontend
          npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NAGARIK_AI_CIVIC }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "Deploying using FIREBASE_TOKEN..."
            npx firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Deploying using Service Account..."
            echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
            npx firebase-tools deploy --only hosting --project nagarik-ai-civic
          else
            echo "Notice: Neither FIREBASE_TOKEN nor FIREBASE_SERVICE_ACCOUNT_NAGARIK_AI_CIVIC is set in repository secrets."
            echo "To enable automated deployment, please add FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT_NAGARIK_AI_CIVIC to repo secrets."
          fi
